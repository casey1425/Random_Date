<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤 데이트 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면 슬롯머신(먹을 것·갈 곳·할 것) → 확정 → 뽑기판 편집 → 지난 데이트 기록 */
:root {
  --bg: #f1f2fa;
  --surface: #ffffff;
  --ink: #1c1f3d;
  --muted: #6a6e91;
  --line: #dcdef0;
  --accent: #ff4d6d;
  --accent-ink: #ffffff;
  --accent-soft: #ffe3e9;
  --slot: #1c1f3d;
  --slot-ink: #fff7d6;
  --ok: #1f9d6b;
  --font-display: "Jua", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12142b; --surface: #1c1f3d; --ink: #eef0ff; --muted: #9a9ec6; --line: #2e3260;
    --accent: #ff6b86; --accent-ink: #1c1f3d; --accent-soft: #3a2140; --slot: #0b0d20; --slot-ink: #ffe98a; --ok: #4fd19b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12142b; --surface: #1c1f3d; --ink: #eef0ff; --muted: #9a9ec6; --line: #2e3260;
  --accent: #ff6b86; --accent-ink: #1c1f3d; --accent-soft: #3a2140; --slot: #0b0d20; --slot-ink: #ffe98a; --ok: #4fd19b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 64px; }
main { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.15; }
h2 { font-size: 1.35rem; }
p { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sub { color: var(--muted); }
header { display: flex; flex-direction: column; gap: 6px; }

/* slots */
.machine { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.slot { display: grid; grid-template-columns: 1fr auto; align-items: stretch; gap: 8px; }
.reel { background: var(--slot); color: var(--slot-ink); border-radius: 14px; padding: 10px 16px; min-height: 76px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.reel small { font-size: 0.72rem; letter-spacing: 0.12em; opacity: 0.7; }
.reel b { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1.25; overflow-wrap: anywhere; }
.reel.spinning b { opacity: 0.75; }
.reel.locked { outline: 3px solid var(--accent); outline-offset: -3px; }
.side { display: flex; flex-direction: column; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; flex: 1; min-width: 64px; font-size: 0.82rem; color: var(--muted); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.cta { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 16px; font-family: var(--font-display); font-size: 1.35rem; }
.cta:disabled { opacity: 0.6; cursor: default; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-weight: 500; }
.ghost.strong { border-color: var(--ink); font-weight: 700; }
.ghost:disabled { opacity: 0.45; cursor: default; }
.note { text-align: center; font-size: 0.85rem; color: var(--muted); min-height: 1.3em; }

/* editor */
section { display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.add button { background: var(--ink); color: var(--bg); border: 0; border-radius: 12px; padding: 0 16px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; max-width: 100%; }
.chip span { overflow-wrap: anywhere; }
.chip button { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; line-height: 1; font-size: 1.1rem; }
.chip button:hover { background: var(--accent-soft); color: var(--ink); }
.count { color: var(--muted); font-size: 0.85rem; }
.reset { align-self: flex-start; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px 0; font-size: 0.85rem; }

/* history */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.entry time { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.entry .what { grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.entry .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.entry .acts button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; }
.entry.done .what { text-decoration: line-through; color: var(--muted); }
.entry.done .acts .toggle { background: var(--ok); color: #fff; border-color: var(--ok); }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; padding: 16px; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .reel b { transition: opacity 0.15s; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘은 뭐 하지?<br>랜덤 데이트 뽑기</h1>
    <p class="sub">먹을 것, 갈 곳, 할 것을 한 번에 뽑아요. 마음에 드는 칸은 고정하고 나머지만 다시 뽑을 수 있어요.</p>
  </header>

  <div class="machine" aria-live="polite">
    <div class="slot" data-k="food"><div class="reel" id="reel-food"><small>먹을 것</small><b>?</b></div><div class="side"><button class="icon-btn" data-lock="food" aria-pressed="false">고정</button><button class="icon-btn" data-redo="food">다시</button></div></div>
    <div class="slot" data-k="place"><div class="reel" id="reel-place"><small>갈 곳</small><b>?</b></div><div class="side"><button class="icon-btn" data-lock="place" aria-pressed="false">고정</button><button class="icon-btn" data-redo="place">다시</button></div></div>
    <div class="slot" data-k="act"><div class="reel" id="reel-act"><small>할 것</small><b>?</b></div><div class="side"><button class="icon-btn" data-lock="act" aria-pressed="false">고정</button><button class="icon-btn" data-redo="act">다시</button></div></div>
    <button class="cta" id="spin">뽑기!</button>
    <div class="row"><button class="ghost strong" id="save" disabled>이걸로 확정</button><button class="ghost" id="copy" disabled>복사</button></div>
    <p class="note" id="note">고정하지 않은 칸을 모두 새로 뽑아요.</p>
  </div>

  <section>
    <h2>뽑기판 만들기</h2>
    <p class="sub">둘이 하고 싶은 걸 직접 넣고, 싫은 건 빼 보세요. 이 기기에 저장돼요.</p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <form class="add" id="addForm">
      <input id="addInput" type="text" maxlength="30" autocomplete="off" aria-label="새 항목">
      <button type="submit">추가</button>
    </form>
    <ul class="chips" id="chips"></ul>
    <p class="count" id="count"></p>
    <button class="reset" id="reset">기본 목록으로 되돌리기</button>
  </section>

  <section>
    <h2>우리의 데이트 기록</h2>
    <ul class="log" id="log"></ul>
  </section>
</main>

<script>
(function () {
  var KEYS = ["food", "place", "act"];
  var LABEL = { food: "먹을 것", place: "갈 곳", act: "할 것" };
  var DEFAULTS = {
    food: ["떡볶이", "삼겹살", "파스타", "초밥", "마라탕", "치킨과 맥주", "브런치", "칼국수", "곱창", "햄버거", "쌀국수", "디저트 카페 투어", "편의점 야식", "고기 뷔페", "피자"],
    place: ["한강공원", "영화관", "보드게임 카페", "서점", "전시회", "놀이공원", "남산 산책", "방탈출 카페", "동네 시장", "만화카페", "야경 명소", "루프탑 카페", "수족관", "드라이브", "공방"],
    act: ["서로 코디해 주기", "인생네컷 찍기", "각자 상대 몰래 선물 사기", "손잡고 1만 보 걷기", "같이 요리하기", "노래방 가기", "서로 초상화 그리기", "영화 보고 평점 매기기", "옛날 사진 같이 보기", "편지 한 장씩 쓰기", "볼링 내기", "버킷리스트 5개 적기", "서로에게 질문 10개", "커플 셀카 대회", "소원 하나씩 들어주기"]
  };
  var LS = "randomDate.v1";
  var state = { lists: clone(DEFAULTS), history: [] };
  var cur = { food: null, place: null, act: null };
  var locked = { food: false, place: false, act: false };
  var tab = "food", spinning = false, resetArmed = false;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function $(id) { return document.getElementById(id); }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(LS));
      if (s && s.lists && s.history) { KEYS.forEach(function (k) { if (!Array.isArray(s.lists[k])) s.lists[k] = clone(DEFAULTS[k]); }); state = s; }
    } catch (e) {}
  }
  function persist() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function pick(k) {
    var l = state.lists[k];
    if (!l.length) return null;
    if (l.length === 1) return l[0];
    var v; do { v = l[Math.floor(Math.random() * l.length)]; } while (v === cur[k]);
    return v;
  }
  function setNote(t) { $("note").textContent = t; }
  function show(k, text) { $("reel-" + k).querySelector("b").textContent = text; }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function spinOne(k, delay) {
    return new Promise(function (resolve) {
      var final = pick(k), reel = $("reel-" + k);
      if (final === null) { show(k, "목록이 비었어요"); cur[k] = null; return resolve(); }
      if (reduce) { cur[k] = final; show(k, final); return resolve(); }
      reel.classList.add("spinning");
      var l = state.lists[k], t = setInterval(function () { show(k, l[Math.floor(Math.random() * l.length)]); }, 70);
      setTimeout(function () { clearInterval(t); reel.classList.remove("spinning"); cur[k] = final; show(k, final); resolve(); }, delay);
    });
  }
  function updateButtons() {
    var ready = KEYS.every(function (k) { return cur[k]; });
    $("save").disabled = !ready || spinning;
    $("copy").disabled = !ready || spinning;
    $("spin").disabled = spinning;
  }
  function spin(keys) {
    if (spinning) return;
    keys = keys.filter(function (k) { return !locked[k]; });
    if (!keys.length) { setNote("전부 고정돼 있어요. 고정을 풀면 다시 뽑을 수 있어요."); return; }
    spinning = true; updateButtons(); setNote("뽑는 중...");
    Promise.all(keys.map(function (k, i) { return spinOne(k, 700 + i * 450); })).then(function () {
      spinning = false; updateButtons();
      setNote(KEYS.every(function (k) { return cur[k]; }) ? "마음에 들면 확정하고, 아니면 한 칸만 다시 뽑아요." : "비어 있는 목록에 항목을 추가해 주세요.");
    });
  }
  function summary() { return cur.food + " 먹고, " + cur.place + " 가서, " + cur.act; }

  document.querySelectorAll("[data-lock]").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.lock; locked[k] = !locked[k];
      b.setAttribute("aria-pressed", String(locked[k]));
      b.textContent = locked[k] ? "고정됨" : "고정";
      $("reel-" + k).classList.toggle("locked", locked[k]);
    });
  });
  document.querySelectorAll("[data-redo]").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.redo;
      if (locked[k]) { setNote(LABEL[k] + " 칸이 고정돼 있어요. 고정을 먼저 풀어 주세요."); return; }
      spin([k]);
    });
  });
  $("spin").addEventListener("click", function () { spin(KEYS); });
  $("save").addEventListener("click", function () {
    state.history.unshift({ id: Date.now(), date: new Date().toISOString().slice(0, 10), food: cur.food, place: cur.place, act: cur.act, done: false });
    persist(); renderLog(); setNote("기록에 저장했어요. 다녀오면 '다녀옴'을 눌러 주세요.");
  });
  $("copy").addEventListener("click", function () {
    var txt = "오늘의 데이트: " + summary();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { setNote("복사했어요. 메신저에 붙여 넣어 보세요."); }, function () { setNote(txt); });
    } else { setNote(txt); }
  });

  /* editor */
  function renderTabs() {
    var box = $("tabs"); box.innerHTML = "";
    KEYS.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(k === tab));
      b.textContent = LABEL[k] + " " + state.lists[k].length;
      b.addEventListener("click", function () { tab = k; renderEditor(); });
      box.appendChild(b);
    });
  }
  function renderEditor() {
    renderTabs();
    $("addInput").placeholder = LABEL[tab] + " 추가 (예: " + DEFAULTS[tab][0] + ")";
    var ul = $("chips"); ul.innerHTML = "";
    state.lists[tab].forEach(function (item, i) {
      var li = document.createElement("li"); li.className = "chip";
      var s = document.createElement("span"); s.textContent = item;
      var x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", item + " 삭제");
      x.addEventListener("click", function () { state.lists[tab].splice(i, 1); persist(); renderEditor(); });
      li.appendChild(s); li.appendChild(x); ul.appendChild(li);
    });
    $("count").textContent = state.lists[tab].length ? "" : "목록이 비었어요. 위에서 항목을 추가해 주세요.";
    $("reset").textContent = resetArmed ? "정말 되돌릴까요? 한 번 더 누르면 직접 추가한 항목이 사라져요." : "기본 목록으로 되돌리기";
  }
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("addInput").value.trim();
    if (!v) return;
    if (state.lists[tab].indexOf(v) === -1) state.lists[tab].push(v);
    $("addInput").value = ""; persist(); renderEditor(); $("addInput").focus();
  });
  $("reset").addEventListener("click", function () {
    if (!resetArmed) { resetArmed = true; renderEditor(); return; }
    state.lists = clone(DEFAULTS); resetArmed = false; persist(); renderEditor();
  });

  /* history */
  function renderLog() {
    var ul = $("log"); ul.innerHTML = "";
    if (!state.history.length) {
      var li = document.createElement("li"); li.className = "empty";
      li.textContent = "아직 기록이 없어요. 뽑은 데이트를 확정하면 여기에 쌓여요."; ul.appendChild(li); return;
    }
    state.history.forEach(function (h) {
      var li = document.createElement("li"); li.className = "entry" + (h.done ? " done" : "");
      var t = document.createElement("time"); t.textContent = h.date;
      var w = document.createElement("div"); w.className = "what"; w.textContent = h.food + " · " + h.place + " · " + h.act;
      var a = document.createElement("div"); a.className = "acts";
      var tg = document.createElement("button"); tg.className = "toggle"; tg.type = "button"; tg.textContent = h.done ? "다녀옴" : "다녀왔어요";
      tg.addEventListener("click", function () { h.done = !h.done; persist(); renderLog(); });
      var rm = document.createElement("button"); rm.type = "button"; rm.textContent = "삭제";
      rm.addEventListener("click", function () { state.history = state.history.filter(function (x) { return x.id !== h.id; }); persist(); renderLog(); });
      a.appendChild(tg); a.appendChild(rm);
      li.appendChild(t); li.appendChild(w); li.appendChild(a); ul.appendChild(li);
    });
  }

  load(); renderEditor(); renderLog(); updateButtons();
})();
</script>
</body>
</html>
